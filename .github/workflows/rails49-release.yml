# Build the layout's firmware and publish it. Fork-only: upstream DCC-EX has no
# such workflow, and nothing here changes what main.yml does.
#
# A tag v<upstream version>-rails49.<n> builds config.rails49.h against the
# ESP32 core, merges the four images into one and attaches it to a release as
# firmware.bin. dccex, the USB mirror on the layout server, flashes the station
# from that asset.
#
# The release is titled with the tag's message, less a leading "<tag>: ". A
# tag without "-test" deletes every release whose tag has "-test" in it; their
# git tags stay.
name: rails49 firmware

on:
  push:
    tags: ['v*-rails49.*']
  workflow_dispatch:

env:
  # The core the station has been built against since 5.4. Pinned because a
  # different core moves the flash offsets this workflow hard codes below.
  ESP32_CORE: 2.0.17
  ESP32_INDEX: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The Guard's per-tick decision, compiled with the host compiler. A
      # broken Reversal or Overload rule stops the release here.
      - name: Test the Guard
        run: rails49/test-guard.sh

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core
        run: |
          arduino-cli core update-index --additional-urls "$ESP32_INDEX"
          arduino-cli core install "esp32:esp32@$ESP32_CORE" --additional-urls "$ESP32_INDEX"

      # config.rails49.h is the whole configuration.
      - name: Write config.h
        run: cp config.rails49.h config.h

      # The station reports this in its <s> banner, so a person reading the
      # banner can tell exactly which build is on the box.
      - name: Stamp the build id
        run: printf '#define GITHUB_SHA "%s"\n' "$GITHUB_REF_NAME" > GITHUB_SHA.h

      - name: Compile
        run: arduino-cli compile --fqbn esp32:esp32:esp32 --warnings all --export-binaries .

      # One file at one offset. The offsets and flash settings are the ones the
      # core's own upload recipe uses (platform.txt, tools.esptool_py.upload).
      - name: Merge into one image
        run: |
          pip install --no-cache-dir esptool==4.5.1
          core="$HOME/.arduino15/packages/esp32/hardware/esp32/$ESP32_CORE"
          build=build/esp32.esp32.esp32
          esptool.py --chip esp32 merge_bin -o firmware.bin \
            --flash_mode dio --flash_freq 80m --flash_size 4MB \
            0x1000  "$build/CommandStation-EX.ino.bootloader.bin" \
            0x8000  "$build/CommandStation-EX.ino.partitions.bin" \
            0xe000  "$core/tools/partitions/boot_app0.bin" \
            0x10000 "$build/CommandStation-EX.ino.bin"
          ls -l firmware.bin

      - name: Keep the image when there is no tag to release
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware.bin

      # checkout leaves the tag without its message, so fetch it again.
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          subject=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          title=${subject#"$GITHUB_REF_NAME: "}
          [ -n "$title" ] || title=$GITHUB_REF_NAME
          gh release create "$GITHUB_REF_NAME" firmware.bin \
            --title "$title" \
            --notes "EX-CSB1 with EX8874, built from config.rails49.h.

          Flash the whole image at offset 0x0:

              esptool.py --chip esp32 --port /dev/dccex --baud 460800 \\
                --before default_reset --after hard_reset write_flash -z \\
                --flash_mode dio --flash_freq 80m --flash_size 4MB 0x0 firmware.bin"

      - name: Delete the test releases
        if: startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-test')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
            --jq '.[].tagName | select(contains("-test"))' |
            xargs -r -n1 gh release delete -R "$GITHUB_REPOSITORY" --yes
